<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d2a" />
  <meta name="description" content="Cifras diarias de la lotería española leídas a la luz de los astros y la numerología." />
  <title>Auguria · Cifras del día</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />

  <!-- iOS PWA: standalone launch + status bar -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Auguria" />

  <!-- iOS PWA splash screens (apple-touch-startup-image) -->
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1290x2796.png"
        media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1179x2556.png"
        media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1284x2778.png"
        media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1170x2532.png"
        media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1125x2436.png"
        media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1242x2688.png"
        media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/splash-828x1792.png"
        media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1242x2208.png"
        media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/splash-750x1334.png"
        media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="icons/splash/splash-640x1136.png"
        media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ─────────────────  CELESTIAL BACKGROUND  ───────────────── -->
  <div class="cosmos" aria-hidden="true">
    <div class="cosmos__veil"></div>
    <div class="cosmos__stars"></div>
    <div class="cosmos__stars cosmos__stars--soft"></div>
    <svg class="cosmos__wheel" viewBox="0 0 600 600" aria-hidden="true">
      <defs>
        <radialGradient id="wheelFade" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#d4a857" stop-opacity="0.18"/>
          <stop offset="70%" stop-color="#d4a857" stop-opacity="0.04"/>
          <stop offset="100%" stop-color="#d4a857" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="300" cy="300" r="290" fill="none" stroke="url(#wheelFade)" stroke-width="0.6"/>
      <circle cx="300" cy="300" r="240" fill="none" stroke="url(#wheelFade)" stroke-width="0.5"/>
      <circle cx="300" cy="300" r="180" fill="none" stroke="url(#wheelFade)" stroke-width="0.4"/>
      <g stroke="url(#wheelFade)" stroke-width="0.4">
        <!-- 12 spokes for the houses -->
        <line x1="300" y1="10"  x2="300" y2="590"/>
        <line x1="10"  y1="300" x2="590" y2="300"/>
        <line x1="93"  y1="93"  x2="507" y2="507"/>
        <line x1="507" y1="93"  x2="93"  y2="507"/>
        <line x1="155" y1="35"  x2="445" y2="565"/>
        <line x1="445" y1="35"  x2="155" y2="565"/>
        <line x1="35"  y1="155" x2="565" y2="445"/>
        <line x1="35"  y1="445" x2="565" y2="155"/>
      </g>
    </svg>
    <div class="cosmos__grain"></div>
  </div>

  <!-- ─────────────────  HEADER  ───────────────── -->
  <header class="masthead">
    <div class="masthead__ornament">
      <svg viewBox="0 0 200 40" aria-hidden="true">
        <line x1="0" y1="20" x2="78" y2="20" stroke="currentColor" stroke-width="0.6"/>
        <line x1="122" y1="20" x2="200" y2="20" stroke="currentColor" stroke-width="0.6"/>
        <g transform="translate(100,20)" fill="none" stroke="currentColor" stroke-width="0.8">
          <circle r="8"/>
          <circle r="3.5"/>
          <path d="M-14,0 L-9,0 M9,0 L14,0 M0,-14 L0,-9 M0,9 L0,14"/>
        </g>
      </svg>
    </div>
    <p class="masthead__eyebrow">Oráculo numérico · Lotería Española</p>
    <h1 class="masthead__title">Auguria</h1>
    <p class="masthead__subtitle">Las cifras que el día escribe para ti.</p>
    <p class="masthead__date" id="dateline" aria-live="polite"></p>
  </header>

  <!-- ─────────────────  CARDS  ───────────────── -->
  <main id="games" class="games" aria-live="polite"></main>

  <!-- ─────────────────  FOOTER  ───────────────── -->
  <footer class="colophon">
    <div class="colophon__rule" aria-hidden="true">
      <svg viewBox="0 0 280 24"><path d="M0 12 H120 M160 12 H280" stroke="currentColor" stroke-width="0.6" fill="none"/><circle cx="140" cy="12" r="2.4" fill="currentColor"/><circle cx="140" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="0.6"/></svg>
    </div>
    <p class="colophon__note">Los números nacen de una semilla forjada con la fecha del día. Vuelve mañana: el cosmos habrá girado.</p>
    <p class="colophon__fineprint">Auguria no garantiza fortuna alguna. Juega con mesura</p>
  </footer>

  <!-- ─────────────────  NUMEROLOGY DIALOG  ───────────────── -->
  <dialog id="numero-dialog" class="numero" aria-labelledby="numero-title">
    <button class="numero__close" type="button" aria-label="Cerrar" data-close>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5 L19 19 M19 5 L5 19" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
    </button>
    <div class="numero__sigil" id="numero-sigil" aria-hidden="true"></div>
    <p class="numero__eyebrow">Numerología</p>
    <h2 id="numero-title" class="numero__title"></h2>
    <p class="numero__reduction" id="numero-reduction"></p>
    <p class="numero__keywords" id="numero-keywords"></p>
    <p class="numero__body" id="numero-body"></p>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
