<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1c1750"/>
      <stop offset="60%" stop-color="#0a0d2a"/>
      <stop offset="100%" stop-color="#06081f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecc879"/>
      <stop offset="100%" stop-color="#b08740"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- starfield -->
  <g fill="#f0e3c0" opacity="0.9">
    <circle cx="88"  cy="120" r="1.6"/>
    <circle cx="140" cy="380" r="1.4"/>
    <circle cx="420" cy="160" r="1.2"/>
    <circle cx="380" cy="420" r="1.6"/>
    <circle cx="74"  cy="300" r="1.0"/>
    <circle cx="450" cy="320" r="1.2"/>
    <circle cx="180" cy="80"  r="1.2"/>
    <circle cx="320" cy="60"  r="1.0"/>
  </g>
  <!-- faint zodiac ring -->
  <g fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.45">
    <circle cx="256" cy="256" r="208"/>
    <circle cx="256" cy="256" r="176"/>
  </g>
  <!-- eight-pointed star -->
  <g transform="translate(256 256)" fill="url(#gold)">
    <path d="M0 -180 L22 -22 L180 0 L22 22 L0 180 L-22 22 L-180 0 L-22 -22 Z"/>
    <path d="M0 -110 L14 -14 L110 0 L14 14 L0 110 L-14 14 L-110 0 L-14 -14 Z" fill="#0a0d2a"/>
